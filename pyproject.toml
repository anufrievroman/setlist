[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "setlist"
dynamic = ["version"]
description = "A minimal backing-track player for band practice, with large waveforms and loudness normalization."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Anufriev Roman" }]
keywords = ["backing tracks", "music", "band", "rehearsal", "audio player", "waveform", "qt"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: MacOS X",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]
dependencies = [
    "PySide6-Essentials>=6.6",
    "PySide6-Addons>=6.6",
    "numpy",
    "scipy",
    "soundfile>=0.12",
]

[project.urls]
Homepage = "https://github.com/anufrievroman/setlist"
Issues = "https://github.com/anufrievroman/setlist/issues"

[project.gui-scripts]
setlist = "setlist.app:main"

[tool.hatch.version]
path = "setlist/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["setlist"]

[tool.hatch.build.targets.sdist]
include = ["setlist", "README.md", "LICENSE", "pyproject.toml"]
